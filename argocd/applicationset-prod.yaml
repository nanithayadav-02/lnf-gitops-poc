apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: sample-app-prod
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - git:
        repoURL: https://github.com/nanithayadav-02/lnf-gitops-poc.git
        revision: main
        directories:
          - path: services/sample-app/overlays/prod
  template:
    metadata:
      name: sample-app-prod
    spec:
      project: poc-project
      source:
        repoURL: https://github.com/nanithayadav-02/lnf-gitops-poc.git
        targetRevision: main
        path: services/sample-app/overlays/prod
      destination:
        server: https://kubernetes.default.svc
        namespace: poc-prod
      syncPolicy:
        syncOptions:
          - CreateNamespace=false
  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true
