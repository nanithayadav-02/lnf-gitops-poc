apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: sample-app-qa
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - git:
        repoURL: https://github.com/nanithayadav-02/lnf-gitops-poc.git
        revision: main
        directories:
          - path: services/sample-app/overlays/qa
  template:
    metadata:
      name: sample-app-qa
    spec:
      project: poc-project
      source:
        repoURL: https://github.com/nanithayadav-02/lnf-gitops-poc.git
        targetRevision: main
        path: services/sample-app/overlays/qa
      destination:
        server: https://kubernetes.default.svc
        namespace: poc-qa
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=false
  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true
