name: Sample App CI and GitOps Update

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write

env:
  IMAGE_NAME: ghcr.io/nanithayadav-02/sample-app

jobs:
  build-scan-publish:
    name: Build, scan and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Trivy vulnerability scan (report only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Update QA overlay with immutable digest
        env:
          IMAGE: ${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path("services/sample-app/overlays/qa/kustomization.yaml")
          content = path.read_text(encoding="utf-8")

          if "\nimages:" in content or content.startswith("images:"):
              raise SystemExit("An images section already exists; refusing to overwrite it.")

          image = os.environ["IMAGE"]
          digest = os.environ["DIGEST"]

          if not digest.startswith("sha256:"):
              raise SystemExit("Invalid image digest")

          content = content.rstrip() + (
              "\n\nimages:\n"
              "  - name: nginx\n"
              f"    newName: {image}\n"
              f"    digest: {digest}\n"
          )

          path.write_text(content, encoding="utf-8")
          print(f"Updated QA image to {image}@{digest}")
          PY

      - name: Create QA GitOps pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/update-qa-image
          delete-branch: true
          commit-message: "Update QA sample-app image digest"
          title: "Deploy new sample-app image to QA"
          body: |
            Automated QA image update.

            - Image: `${{ env.IMAGE_NAME }}`
            - Digest: `${{ steps.build.outputs.digest }}`
            - Source commit: `${{ github.sha }}`

            Review and merge this change to deploy to QA.
          add-paths: |
            services/sample-app/overlays/qa/kustomization.yaml
